
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexAI Pro - Gestão Jurídica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1C1C1C;
            --bg-tertiary: #2D2D2D;
            --text-main: #E0E0E0;
            --text-muted: #9CA3AF;
            --border-color: rgba(75, 85, 99, 0.5);
            --gold: #D4AF37;
        }

        .light-mode {
            --bg-primary: #F9FAFB;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F3F4F6;
            --text-main: #000000;
            --text-muted: #374151;
            --border-color: #D1D5DB;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #D4AF37 0%, #C5A028 100%);
        }
        .graphite-dark {
            background-color: var(--bg-secondary);
        }
        .graphite-light {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }
        .gold-text {
            color: #D4AF37;
        }
        .gold-border {
            border-color: #D4AF37;
        }

        /* Overrides para Light Mode */
        .light-mode .text-white:not(.briefing-content),
        .light-mode .text-gray-100:not(.briefing-content),
        .light-mode .text-gray-200:not(.briefing-content),
        .light-mode .text-gray-300:not(.briefing-content),
        .light-mode .italic.text-gray-300:not(.briefing-content) {
            color: #000000 !important;
        }

        .light-mode .text-gray-400,
        .light-mode .text-gray-500,
        .light-mode .text-gray-600 {
            color: #374151 !important;
        }

        .light-mode .briefing-card {
            background: #FFFFFF !important;
            border-color: rgba(212, 175, 55, 0.2) !important;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05) !important;
        }
        
        .light-mode .briefing-content,
        .light-mode .briefing-content p,
        .light-mode .briefing-content span {
            color: #111827 !important;
            opacity: 1 !important;
        }

        .light-mode .graphite-light, 
        .light-mode .graphite-dark {
            background-color: var(--bg-secondary) !important;
            border-color: var(--border-color) !important;
        }

        .light-mode .bg-primary {
            background-color: var(--bg-primary) !important;
        }

        .light-mode .bg-black\/20,
        .light-mode .bg-black\/30,
        .light-mode .bg-black\/40,
        .light-mode .bg-black\/60,
        .light-mode .bg-black\/80,
        .light-mode .bg-black\/90,
        .light-mode .bg-\[\#1C1C1C\],
        .light-mode .bg-\[\#121212\] {
            background-color: rgba(0, 0, 0, 0.05) !important;
        }

        .light-mode .bg-white\/5,
        .light-mode .bg-white\/10 {
            background-color: rgba(0, 0, 0, 0.03) !important;
        }

        .light-mode .border-gray-800,
        .light-mode .border-gray-700,
        .light-mode .border-\[\#D4AF37\]\/20 {
            border-color: var(--border-color) !important;
        }

        .light-mode section:not(.briefing-card) div:not(.briefing-card):not(.briefing-content), 
        .light-mode section:not(.briefing-card) p:not(.briefing-content), 
        .light-mode section:not(.briefing-card) li,
        .light-mode section:not(.briefing-card) h3:not(.gold-text),
        .light-mode table thead th,
        .light-mode table tbody td p {
            color: #000000 !important;
        }

        .light-mode .gold-text {
            color: #D4AF37 !important;
        }

        .light-mode .gold-gradient span,
        .light-mode .gold-gradient {
            color: #FFFFFF !important;
        }
        
        .light-mode .gold-gradient {
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2) !important;
        }

        .light-mode input::placeholder {
            color: #9CA3AF !important;
        }

        /* Garantir visibilidade do logo no modo claro */
        .light-mode .logo-img {
            mix-blend-mode: normal !important;
            filter: contrast(1.1) !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 4px;
        }

        @media print {
            body * {
                visibility: hidden;
                background: none !important;
                box-shadow: none !important;
            }
            #printable-doc, #printable-doc * {
                visibility: visible;
            }
            #printable-doc {
                position: absolute;
                left: 0;
                top: 0;
                width: 210mm !important;
                height: 297mm !important;
                margin: 0 !important;
                padding: 20mm !important;
                background-color: white !important;
                color: black !important;
                box-shadow: none !important;
                border: none !important;
            }
            .no-print {
                display: none !important;
            }
            @page {
                size: A4;
                margin: 0;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "mammoth": "https://esm.sh/mammoth@1.6.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
